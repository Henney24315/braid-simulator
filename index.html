<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Orbit&family=ZCOOL+QingKe+HuangYou&display=swap');

  /* ── 테마 변수 ─────────────────────────────────────────────────
     여기서만 수정하면 전체 UI 색상이 바뀝니다.
     --primary     : 메인 강조색 (solid)
     --primary-rgb : 강조색 R,G,B (rgba() 투명도 조합용)
     --bd-rgb      : 테두리·트랙 전용 RGB (조금 더 차분한 톤)
     --bg          : 캔버스·앱 배경색
     --core-rgb    : 코어 실린더 재질색 (조명 계산에 사용)
  ─────────────────────────────────────────────────────────────── */
  :root {
    --primary: #6495ed;
    --primary-rgb: 100, 149, 237;
    --bd-rgb: 255, 255, 255;
    --bg: #ffffff;
    --core-rgb: 230, 205, 165;
    /* 코어 실린더 나무색 */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    font-family: "Orbit", monospace;
    width: 100%;
  }

  .app {
    display: flex;
    flex-direction: column;
  }

  .topbar {
    padding: 11px 18px 9px;
    border-bottom: 1px solid rgba(var(--primary-rgb), 0.15);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .ttl {
    font-size: 20px;
    color: var(--primary);
    letter-spacing: 0.05em;
  }

  /* 페이지 메뉴 (현재 페이지는 aria-current="page" 로 강조) */
  .menu {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }

  .menu a {
    font-size: 14px;
    color: var(--primary);
    text-decoration: none;
    border: 1px solid rgba(var(--primary-rgb), 0.25);
    border-radius: 4px;
    padding: 5px 12px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .menu a:hover {
    border-color: rgba(var(--primary-rgb), 0.6);
  }

  .menu a[aria-current="page"] {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .sub {
    font-size: 13px;
    color: rgba(var(--primary-rgb), 0.4);
    letter-spacing: 0.08em;
  }

  .body {
    display: flex;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    gap: 8px;
  }

  canvas#braid {
    border-radius: 6px;
    cursor: grab;
    max-width: 100%;
    height: auto;
    aspect-ratio: 420 / 620;
    display: block;
  }

  canvas#braid:active {
    cursor: grabbing;
  }

  .hint {
    font-size: 12px;
    color: var(--primary);
    letter-spacing: 0.1em;
  }

  .right {
    width: 300px;
    border-left: 1px solid rgba(var(--primary-rgb), 0.1);
    display: flex;
    flex-direction: column;
  }

  .picker-area {
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .lbl {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--primary);
    text-transform: uppercase;
    align-self: flex-start;
  }

  .ring-wrap {
    width: 210px;
    max-width: 100%;
  }

  canvas#ring {
    display: block;
    width: 100%;
    height: auto;
    cursor: default;
  }

  .stepnav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    color: var(--primary);
  }

  .stepnav button {
    width: 34px;
    height: 28px;
    background: transparent;
    border: 1px solid rgba(var(--primary-rgb), 0.25);
    border-radius: 4px;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
  }

  .stepnav button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .stepnav span {
    min-width: 90px;
    text-align: center;
  }

  #colorProxy {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    top: 0;
    left: 50%;
    width: 0;
    height: 0;
  }

  .sliders {
    padding: 10px 14px;
    border-top: 1px solid rgba(var(--primary-rgb), 0.1);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .sr {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .srow {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--primary);
  }

  .sv {
    color: var(--primary);
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: rgba(var(--primary-rgb), 0.2);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
  }

  .rbtn {
    margin: 8px 14px 12px;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(var(--primary-rgb), 0.18);
    border-radius: 4px;
    color: var(--primary);
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.04em;
    width: calc(100% - 28px);
  }

  .rbtn:hover {
    border-color: rgba(var(--primary-rgb), 0.5);
    color: var(--primary);
  }

  .rbtn + .rbtn {
    margin-top: 0;
  }

  .copyright {
    border-top: 1px solid rgba(var(--primary-rgb), 0.15);
    text-align: center;
    padding: 10px 0 12px;
    font-size: 12px;
    color: var(--primary);
    letter-spacing: 0.1em;
    white-space: pre-wrap;
  }

  /* ── 모바일 반응형 ─────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .topbar {
      flex-wrap: wrap;
      row-gap: 6px;
    }
    .body {
      flex-direction: column;
    }
    .left {
      padding: 10px 12px 4px;
      width: 100%;
    }
    canvas#braid {
      max-height: 70vh;
      width: auto;
    }
    .right {
      width: 100%;
      border-left: none;
      border-top: 1px solid rgba(var(--primary-rgb), 0.1);
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .picker-area {
      flex: 0 0 auto;
      padding: 10px 8px 8px;
    }
    .ring-wrap {
      width: 150px;
    }
    .controls {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 6px;
      gap: 4px;
    }
    .sliders {
      border-top: none;
      padding: 0;
    }
    .rbtn {
      font-size: 12px;
      margin: 8px 0 0;
      width: 100%;
    }
    .rbtn + .rbtn {
      margin-top: 6px;
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 20px;
      height: 20px;
    }
    input[type="range"] {
      height: 4px;
    }
    .copyright {
      font-size: 10px;
    }
  }
</style>

<script>
  // ── CSS 테마 변수 → JS 상수 ──────────────────────────────────────
  // CSS :root 의 --primary-rgb, --core-rgb 등을 읽어 JS 전체에서 재사용
  const _cs = getComputedStyle( document.documentElement );
  const _primRgb = _cs.getPropertyValue( "--primary-rgb" ).trim();
  const _coreRgb = _cs.getPropertyValue( "--core-rgb" ).trim();
  const _bg = _cs.getPropertyValue( "--bg" ).trim();

  /** rgba(--primary-rgb, alpha) */
  const acRgba = ( a ) => `rgba(${_primRgb},${a})`;
  /** --core-rgb 배열 [r,g,b] (코어 실린더 조명용) */
  const coreArr = _coreRgb.split( "," ).map( Number );

  // ── 배색 설정 (여기서만 수정) ────────────────────────────────────
  // 나 기준 왼쪽: L1~L4 / 오른쪽: R1~R4 (총 8가닥)
  const COLORS = {
    L4: "#888888",
    L3: "#FF1C7A",
    L2: "#ffffff",
    L1: "#1CFF55",
    R1: "#F7FF1C",
    R2: "#1C7BFF",
    R3: "#FFAA52",
    R4: "#FF52F6",
  };

  // ── 가닥 배치 ────────────────────────────────────────────────────
  // placeDeg : 링 캔버스에서의 시작 위치 (0° = 3시, 시계 방향으로 증가, 나 = 아래 90°)
  const SLOTS = [
    { id: 0, label: "L4", placeDeg: 22.5, color: COLORS.L4 },
    { id: 1, label: "L3", placeDeg: 292.5, color: COLORS.L3 },
    { id: 2, label: "L2", placeDeg: 202.5, color: COLORS.L2 },
    { id: 3, label: "L1", placeDeg: 112.5, color: COLORS.L1 },
    { id: 4, label: "R1", placeDeg: 67.5, color: COLORS.R1 },
    { id: 5, label: "R2", placeDeg: 337.5, color: COLORS.R2 },
    { id: 6, label: "R3", placeDeg: 247.5, color: COLORS.R3 },
    { id: 7, label: "R4", placeDeg: 157.5, color: COLORS.R4 },
  ];

  // ── 자리 ────────────────────────────────────────────────────────
  // 링 위의 8자리. 자리 i 의 각도 = 22.5° + 45°·i (시계 방향), L 자리와 R 자리가 번갈아 있음
  // 둘레 좌표 s 에서 자리 i 의 중심은 s = i (자리 간격 = 1)
  const N_POS = 8;
  const posDeg = ( s ) => 22.5 + 45 * s;
  const START = Array.from( { length: N_POS }, ( _, p ) => SLOTS.findIndex( ( sl ) => sl.placeDeg === posDeg( p ) ) );

  // 한 단(段)마다 실이 옮겨 가는 규칙 { 지금 자리: 다음 자리 }
  // 적히지 않은 자리의 실은 그대로 내려옴. 단마다 차례로 돌아가며 적용 (L 단 → R 단 → L 단 …).
  // 1단: L 가닥 4개가 반시계 방향으로 다음 L 자리로 / 2단: R 가닥 4개가 시계 방향으로 다음 R 자리로
  const STEP_RULES = [
    { 0: 6, 2: 0, 4: 2, 6: 4 },
    { 1: 3, 3: 5, 5: 7, 7: 1 },
  ];

  /** 단 0..n 의 배치. states[j][자리] = 가닥 번호 */
  function computeStates( n ) {
    let cur = START.slice();
    const states = [ cur ];
    for ( let j = 0; j < n; j++ ) {
      const rule = STEP_RULES[ j % STEP_RULES.length ];
      const next = cur.slice();
      for ( const [ from, to ] of Object.entries( rule ) ) next[ to ] = cur[ from ];
      states.push( next );
      cur = next;
    }
    return states;
  }

  const smooth = ( t ) => t * t * ( 3 - 2 * t );

  /** 자리 a → b 로 둘레를 따라 가는 가장 짧은 방향의 이동량 (음수 = 반시계) */
  function shortestDelta( a, b ) {
    return ( ( ( b - a + N_POS * 1.5 ) % N_POS ) + N_POS ) % N_POS - N_POS / 2;
  }

  // ── 전역 상태 ───────────────────────────────────────────────────
  let colors = SLOTS.map( ( s ) => s.color );
  let steps = 16;
  let stepH = 0.25;
  let thickness = 8;
  let viewStep = 0;
  let states = computeStates( steps );
  let rotX = 0;
  let rotY = 0;
  let zoom = 1;
  let dragging = false;
  let lx = 0,
    ly = 0;
  let hovered = -1;

  // ── Ring 캔버스 ─────────────────────────────────────────────────
  const rc = document.getElementById( "ring" );
  const rctx = rc.getContext( "2d" );
  const RW = rc.width,
    RH = rc.height,
    RCX = RW / 2,
    RCY = 105;
  const RING_R = 70,
    DOT_R = 15,
    TRACK_R = 92; // 이동 화살표가 지나가는 바깥 원

  function posXY( s, r = RING_R ) {
    const a = ( posDeg( s ) * Math.PI ) / 180;
    return { x: RCX + r * Math.cos( a ), y: RCY + r * Math.sin( a ) };
  }

  function isDark( hex ) {
    const r = parseInt( hex.slice( 1, 3 ), 16 );
    const g = parseInt( hex.slice( 3, 5 ), 16 );
    const b = parseInt( hex.slice( 5, 7 ), 16 );
    return ( r * 299 + g * 587 + b * 114 ) / 1000 < 128;
  }

  function drawRing() {
    rctx.clearRect( 0, 0, RW, RH );
    rctx.font = "12px sans-serif";
    const st = states[ viewStep ];

    // 배경 가이드 원
    rctx.beginPath();
    rctx.arc( RCX, RCY, RING_R, 0, Math.PI * 2 );
    rctx.strokeStyle = acRgba( 1 );
    rctx.lineWidth = 1;
    rctx.setLineDash( [ 2, 5 ] );
    rctx.stroke();
    rctx.setLineDash( [] );

    // 가운데 원통
    rctx.beginPath();
    rctx.arc( RCX, RCY, 9, 0, Math.PI * 2 );
    rctx.fillStyle = `rgb(${coreArr.join( "," )})`;
    rctx.fill();
    rctx.strokeStyle = "rgba(0,0,0,0.25)";
    rctx.stroke();

    // 자리 바큇살
    for ( let p = 0; p < N_POS; p++ ) {
      const a = posXY( p, 9 ),
        b = posXY( p );
      rctx.beginPath();
      rctx.moveTo( a.x, a.y );
      rctx.lineTo( b.x, b.y );
      rctx.strokeStyle = acRgba( 1 );
      rctx.lineWidth = 1;
      rctx.stroke();
    }

    // 다음 단으로 옮겨 가는 실의 경로 (바깥 원)
    if ( viewStep < steps ) {
      const nx = states[ viewStep + 1 ];
      for ( let p = 0; p < N_POS; p++ ) {
        const si = st[ p ];
        const q = nx.indexOf( si );
        if ( q === p ) continue;
        const d = shortestDelta( p, q );
        const a0 = ( posDeg( p ) * Math.PI ) / 180,
          a1 = ( posDeg( p + d ) * Math.PI ) / 180;
        const s0 = posXY( p, RING_R + DOT_R ),
          q0 = posXY( q, RING_R + DOT_R ),
          t0 = posXY( p, TRACK_R );

        rctx.lineJoin = "round";
        rctx.lineCap = "round";
        rctx.beginPath();
        rctx.moveTo( s0.x, s0.y );
        rctx.lineTo( t0.x, t0.y );
        rctx.arc( RCX, RCY, TRACK_R, a0, a1, d < 0 );
        rctx.lineTo( q0.x, q0.y );
        rctx.strokeStyle = "rgba(0,0,0,0.35)";
        rctx.lineWidth = 4.5;
        rctx.stroke();
        rctx.strokeStyle = colors[ si ];
        rctx.lineWidth = 2.5;
        rctx.stroke();

        // 화살촉 (바깥 원 끝에서 진행 방향으로)
        const tip = posXY( p + d, TRACK_R );
        const ang = a1 + ( d > 0 ? Math.PI / 2 : -Math.PI / 2 );
        rctx.beginPath();
        rctx.moveTo( tip.x + 7 * Math.cos( ang ), tip.y + 7 * Math.sin( ang ) );
        rctx.lineTo( tip.x + 7 * Math.cos( ang + 2.5 ), tip.y + 7 * Math.sin( ang + 2.5 ) );
        rctx.lineTo( tip.x + 7 * Math.cos( ang - 2.5 ), tip.y + 7 * Math.sin( ang - 2.5 ) );
        rctx.closePath();
        rctx.fillStyle = "rgba(0,0,0,0.55)";
        rctx.fill();
      }
    }

    // "나" 기준점 (링 하단 외부 고정 마커)
    const mx = RCX,
      my = RCY + TRACK_R + 10;
    rctx.beginPath();
    rctx.moveTo( mx, my - 7 );
    rctx.lineTo( mx - 5, my );
    rctx.lineTo( mx + 5, my );
    rctx.closePath();
    rctx.fillStyle = acRgba( 0.55 );
    rctx.fill();
    rctx.fillStyle = acRgba( 0.65 );
    rctx.textAlign = "center";
    rctx.textBaseline = "top";
    rctx.fillText( "나", mx, my );

    // 자리 도트
    for ( let p = 0; p < N_POS; p++ ) {
      const si = st[ p ];
      const pt = posXY( p );
      const col = colors[ si ];
      const hov = p === hovered;

      if ( hov ) {
        rctx.beginPath();
        rctx.arc( pt.x, pt.y, DOT_R + 6, 0, Math.PI * 2 );
        rctx.fillStyle = col + "25";
        rctx.fill();
      }

      rctx.beginPath();
      rctx.arc( pt.x, pt.y, DOT_R + 1, 0, Math.PI * 2 );
      rctx.fillStyle = "rgba(0,0,0,0.5)";
      rctx.fill();

      rctx.beginPath();
      rctx.arc( pt.x, pt.y, DOT_R, 0, Math.PI * 2 );
      rctx.fillStyle = col;
      rctx.fill();
      rctx.strokeStyle = hov ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.18)";
      rctx.lineWidth = hov ? 2 : 1;
      rctx.stroke();

      rctx.fillStyle = isDark( col ) ? "rgba(255,255,255,1)" : "rgba(0,0,0,0.75)";
      rctx.textAlign = "center";
      rctx.textBaseline = "middle";
      rctx.fillText( SLOTS[ si ].label, pt.x, pt.y );
    }
  }

  function hitDot( ex, ey ) {
    const rect = rc.getBoundingClientRect();
    const mx = ( ex - rect.left ) * ( RW / rect.width );
    const my = ( ey - rect.top ) * ( RH / rect.height );
    for ( let p = 0; p < N_POS; p++ ) {
      const pt = posXY( p );
      if ( ( mx - pt.x ) ** 2 + ( my - pt.y ) ** 2 <= ( DOT_R + 5 ) ** 2 ) return p;
    }
    return -1;
  }

  rc.addEventListener( "mousemove", ( e ) => {
    const h = hitDot( e.clientX, e.clientY );
    if ( h !== hovered ) {
      hovered = h;
      drawRing();
    }
    rc.style.cursor = h >= 0 ? "pointer" : "default";
  } );
  rc.addEventListener( "mouseleave", () => {
    hovered = -1;
    drawRing();
    rc.style.cursor = "default";
  } );

  const proxy = document.getElementById( "colorProxy" );
  rc.addEventListener( "click", ( e ) => {
    const h = hitDot( e.clientX, e.clientY );
    if ( h < 0 ) return;
    const si = states[ viewStep ][ h ];
    proxy.value = colors[ si ];
    proxy.onchange = function() {
      colors[ si ] = this.value;
      drawRing();
      drawBraid();
    };
    proxy.click();
  } );

  // ── 단 보기 (◀ ▶) ───────────────────────────────────────────────
  const stepPrev = document.getElementById( "stepPrev" );
  const stepNext = document.getElementById( "stepNext" );
  const stepLabel = document.getElementById( "stepLabel" );

  function updateStepNav() {
    viewStep = Math.max( 0, Math.min( steps, viewStep ) );
    stepLabel.textContent = viewStep === 0 ? "시작 배치" : `${viewStep}단 후`;
    stepPrev.disabled = viewStep === 0;
    stepNext.disabled = viewStep === steps;
  }
  stepPrev.addEventListener( "click", () => {
    viewStep--;
    updateStepNav();
    drawRing();
  } );
  stepNext.addEventListener( "click", () => {
    viewStep++;
    updateStepNav();
    drawRing();
  } );

  // ── Braid 3D 캔버스 ─────────────────────────────────────────────
  const bc = document.getElementById( "braid" );
  const bctx = bc.getContext( "2d" );
  const BW = bc.width,
    BH = bc.height,
    BCX = BW / 2,
    BCY = BH / 2;

  const CORE_R = 0.5;
  const GAP = ( 2 * Math.PI * CORE_R ) / N_POS; // 자리 간격 (둘레 길이)
  const OFF0 = 0.07, // 실이 원통 표면에서 떠 있는 거리
    OFF_AMP = 0.06; // 다른 실 바깥으로 감싸며 지나갈 때 더해지는 거리
  const PERSP = 720 / ( 720 + 230 );
  let sc = 112;

  // 원근 투영: rotY(Y축) → rotX(X축) 회전 후 Z축 원근 적용, d(깊이)=큰값이 카메라에서 멀어짐
  function proj( x, y, z ) {
    const x1 = x * Math.cos( rotY ) - z * Math.sin( rotY );
    const z1 = x * Math.sin( rotY ) + z * Math.cos( rotY );
    const y2 = y * Math.cos( rotX ) - z1 * Math.sin( rotX );
    const z2 = y * Math.sin( rotX ) + z1 * Math.cos( rotX );
    const s = 720 / ( 720 + z2 + 230 );
    return { sx: BCX + x1 * s * sc, sy: BCY + y2 * s * sc, d: z2 };
  }

  /** 수평 법선 (cos φ, 0, sin φ) 의 카메라 방향 성분. 음수면 나를 향함 */
  function facing( phi ) {
    return ( Math.cos( phi ) * Math.sin( rotY ) + Math.sin( phi ) * Math.cos( rotY ) ) * Math.cos( rotX );
  }

  function hexToRgb( hex ) {
    return [
      parseInt( hex.slice( 1, 3 ), 16 ),
      parseInt( hex.slice( 3, 5 ), 16 ),
      parseInt( hex.slice( 5, 7 ), 16 ),
    ];
  }

  // 불투명 코어 원기둥 (뒷면 실을 가리는 역할)
  function drawCoreCylinder( R, L ) {
    const ASTEPS = 48;
    const yT = -L / 2,
      yB = L / 2;
    const shade = ( diffuse ) => {
      const v = 0.45 + diffuse * 0.65;
      return `rgb(${Math.round( coreArr[ 0 ] * v )},${Math.round( coreArr[ 1 ] * v )},${Math.round( coreArr[ 2 ] * v )})`;
    };

    // 옆면: 나를 향한 띠만 그림
    for ( let ai = 0; ai < ASTEPS; ai++ ) {
      const a0 = ( ai / ASTEPS ) * Math.PI * 2;
      const a1 = ( ( ai + 1 ) / ASTEPS ) * Math.PI * 2;
      const nz = facing( ( a0 + a1 ) / 2 );
      if ( nz >= 0 ) continue;
      const pts = [
        proj( R * Math.cos( a0 ), yT, R * Math.sin( a0 ) ),
        proj( R * Math.cos( a1 ), yT, R * Math.sin( a1 ) ),
        proj( R * Math.cos( a1 ), yB, R * Math.sin( a1 ) ),
        proj( R * Math.cos( a0 ), yB, R * Math.sin( a0 ) ),
      ];
      bctx.beginPath();
      pts.forEach( ( p, i ) => ( i ? bctx.lineTo( p.sx, p.sy ) : bctx.moveTo( p.sx, p.sy ) ) );
      bctx.closePath();
      bctx.fillStyle = bctx.strokeStyle = shade( -nz );
      bctx.lineWidth = 1;
      bctx.fill();
      bctx.stroke();
    }

    // 윗면 / 아랫면
    const capN = Math.sin( rotX );
    if ( capN !== 0 ) {
      const y = capN > 0 ? yT : yB;
      bctx.beginPath();
      for ( let ai = 0; ai <= ASTEPS; ai++ ) {
        const a = ( ai / ASTEPS ) * Math.PI * 2;
        const p = proj( R * Math.cos( a ), y, R * Math.sin( a ) );
        ai ? bctx.lineTo( p.sx, p.sy ) : bctx.moveTo( p.sx, p.sy );
      }
      bctx.fillStyle = shade( Math.abs( capN ) * 0.8 );
      bctx.fill();
    }
  }

  function drawBraid() {
    bctx.clearRect( 0, 0, BW, BH );
    bctx.fillStyle = _bg || "#ffffff";
    bctx.fillRect( 0, 0, BW, BH );

    const L = steps * stepH;
    sc = zoom * Math.min( 170, ( BH * 0.84 ) / ( L * PERSP ) );
    const SUB = 16;
    const backSegs = [],
      frontSegs = [];

    // 가닥 하나의 구간 목록 { t0, t1 (단), s0 (둘레 좌표), d (이동량) }
    // 옮겨 가는 실은 다음에 다시 옮겨질 때까지 비스듬히 이어지게 해서, 실제 코처럼 계속 기울어 보이게 함
    function strandSpans( si ) {
      const moves = [];
      for ( let j = 0; j < steps; j++ ) {
        const p = states[ j ].indexOf( si ),
          q = states[ j + 1 ].indexOf( si );
        if ( p !== q ) moves.push( { j, p, d: shortestDelta( p, q ) } );
      }
      const spans = [];
      if ( !moves.length ) return [ { t0: 0, t1: steps, s0: states[ 0 ].indexOf( si ), d: 0 } ];
      if ( moves[ 0 ].j > 0 ) spans.push( { t0: 0, t1: moves[ 0 ].j, s0: moves[ 0 ].p, d: 0 } );
      const gap = moves.length > 1 ? moves[ 1 ].j - moves[ 0 ].j : 1;
      moves.forEach( ( m, k ) => {
        const t1 = k + 1 < moves.length ? moves[ k + 1 ].j : Math.min( steps, m.j + gap );
        spans.push( { t0: m.j, t1, s0: m.p, d: m.d } );
        if ( k + 1 === moves.length && t1 < steps ) spans.push( { t0: t1, t1: steps, s0: m.p + m.d, d: 0 } );
      } );
      return spans;
    }

    // 구간 안의 위치 (u: 0~1). 옮겨 가는 실은 다른 실 바깥으로 감싸며 지나감:
    // 나중에 옮긴 실일수록 바깥에 있도록, 옮기기 시작할 때 가장 바깥이고 다음 이동 때까지 점점 안으로 눌림
    // 링 캔버스의 각도 θ(아래 = 나)를 3D 로: x = r·cosθ, z = −r·sinθ (z 가 작을수록 나에게 가까움)
    function pathPoint( sp, u ) {
      const th = ( posDeg( sp.s0 + sp.d * u ) * Math.PI ) / 180;
      const ov = sp.d ? ( 1 - u ) * smooth( Math.min( 1, u * 3 ) ) : 0;
      const y = -L / 2 + ( sp.t0 + ( sp.t1 - sp.t0 ) * u ) * stepH;
      const r0 = CORE_R + OFF0,
        r = r0 + OFF_AMP * ov;
      return {
        p: proj( r * Math.cos( th ), y, -r * Math.sin( th ) ),
        db: proj( r0 * Math.cos( th ), y, -r0 * Math.sin( th ) ).d, // 감김과 상관없는 표면 깊이
        ov,
        phi: -th,
      };
    }

    for ( let si = 0; si < SLOTS.length; si++ ) {
      const rgb = hexToRgb( colors[ si ] );
      for ( const sp of strandSpans( si ) ) {
        const n = Math.max( 1, Math.round( SUB * ( sp.t1 - sp.t0 ) ) );
        let prev = pathPoint( sp, 0 );
        for ( let k = 1; k <= n; k++ ) {
          const cur = pathPoint( sp, k / n );
          const mid = pathPoint( sp, ( k - 0.5 ) / n );
          const nz = facing( mid.phi );
          const light = 0.6 + 0.55 * Math.max( 0, -nz );
          const sh = light * ( 0.7 + 0.55 * mid.ov ); // 아래로 눌린 부분일수록 어둡게
          const seg = {
            p0: prev.p,
            p1: cur.p,
            fill: rgb.map( ( c ) => Math.min( 255, c * sh ) ),
            edge: rgb.map( ( c ) => c * sh * 0.4 ),
            lw: ( thickness / 10 ) * GAP * sc * PERSP * ( 1 + 0.12 * mid.ov ),
            // 겹치는 곳에서 더 바깥에 감긴 실이 확실히 위에 오도록, 표면 깊이에서 감김 정도만큼 앞으로 당긴 깊이 (조각 양 끝)
            d0: prev.db - prev.ov * GAP * 2,
            d1: cur.db - cur.ov * GAP * 2,
          };
          // 나를 향한 쪽의 실은 원통 앞에, 반대쪽 실은 원통 뒤에 그림
          ( nz < 0 ? frontSegs : backSegs ).push( seg );
          prev = cur;
        }
      }
    }

    backSegs.length && bctx.drawImage( rasterize( backSegs ), 0, 0 );
    drawCoreCylinder( CORE_R * 0.99, L );
    frontSegs.length && bctx.drawImage( rasterize( frontSegs ), 0, 0 );
  }

  // 실 조각들을 픽셀 단위 깊이 버퍼(z-buffer)로 그림. 픽셀마다 가장 앞에 있는 실만 남기므로
  // 겹친 곳의 경계가 끊김 없이 갈리고, 위로 지나가는 실의 어두운 테두리가 아래 실을 또렷하게 가림.
  // 실 가운데일수록 살짝 앞에 있는 것으로 쳐서 둥근 실처럼 겹치고, 가운데는 밝고 가장자리는 어둡게 칠함
  const zCanvas = document.createElement( "canvas" );
  zCanvas.width = BW;
  zCanvas.height = BH;
  const zctx = zCanvas.getContext( "2d" );
  const zbuf = new Float32Array( BW * BH );

  function rasterize( segs ) {
    const img = zctx.createImageData( BW, BH );
    const px = img.data;
    zbuf.fill( Infinity );
    const ROUND = GAP * 0.4; // 실 단면을 둥글게 칠 때 가운데와 가장자리의 깊이 차
    for ( const g of segs ) {
      const R = g.lw / 2,
        RO = R + Math.max( 1, g.lw * 0.09 );
      const ax = g.p0.sx,
        ay = g.p0.sy,
        dx = g.p1.sx - ax,
        dy = g.p1.sy - ay;
      const len2 = dx * dx + dy * dy || 1e-9,
        len = Math.sqrt( len2 );
      const xa = Math.max( 0, Math.floor( Math.min( ax, g.p1.sx ) - RO ) ),
        xb = Math.min( BW - 1, Math.ceil( Math.max( ax, g.p1.sx ) + RO ) ),
        ya = Math.max( 0, Math.floor( Math.min( ay, g.p1.sy ) - RO ) ),
        yb = Math.min( BH - 1, Math.ceil( Math.max( ay, g.p1.sy ) + RO ) );
      for ( let y = ya; y <= yb; y++ ) {
        const cy = y + 0.5 - ay;
        for ( let x = xa; x <= xb; x++ ) {
          const cx = x + 0.5 - ax;
          const t = Math.max( 0, Math.min( 1, ( cx * dx + cy * dy ) / len2 ) );
          const ex = cx - t * dx,
            ey = cy - t * dy;
          if ( ex * ex + ey * ey > RO * RO ) continue;
          // 둥글기·테두리는 조각 끝이 아니라 실 중심선까지의 거리로 정해서 조각 이음매가 보이지 않게 함
          const side = Math.abs( cx * dy - cy * dx ) / len;
          const q = side / R;
          const z = g.d0 + ( g.d1 - g.d0 ) * t + ROUND * q * q;
          const i = y * BW + x;
          if ( z >= zbuf[ i ] ) continue;
          zbuf[ i ] = z;
          const o = i * 4;
          if ( side > R ) {
            px[ o ] = g.edge[ 0 ];
            px[ o + 1 ] = g.edge[ 1 ];
            px[ o + 2 ] = g.edge[ 2 ];
          } else {
            const f = 1.08 - 0.38 * q * q;
            px[ o ] = g.fill[ 0 ] * f;
            px[ o + 1 ] = g.fill[ 1 ] * f;
            px[ o + 2 ] = g.fill[ 2 ] * f;
          }
          px[ o + 3 ] = 255;
        }
      }
    }
    zctx.putImageData( img, 0, 0 );
    return zCanvas;
  }

  // 드래그·확대처럼 연달아 들어오는 입력은 화면 갱신 한 번에 한 번만 다시 그림
  let drawPending = false;
  function requestDraw() {
    if ( drawPending ) return;
    drawPending = true;
    requestAnimationFrame( () => {
      drawPending = false;
      drawBraid();
    } );
  }

  function resetView() {
    rotX = 0;
    rotY = 0;
    zoom = 1;
    drawBraid();
  }

  // 지금 쓰는 색들을 가닥끼리 무작위로 바꿔 끼움 (Fisher–Yates, 이전과 똑같은 배치는 다시 섞음)
  function shuffleColors() {
    const prev = colors.join();
    do {
      for ( let i = colors.length - 1; i > 0; i-- ) {
        const j = Math.floor( Math.random() * ( i + 1 ) );
        [ colors[ i ], colors[ j ] ] = [ colors[ j ], colors[ i ] ];
      }
    } while ( colors.join() === prev && new Set( colors ).size > 1 );
    drawRing();
    drawBraid();
  }

  function hslToHex( h, s, l ) {
    s /= 100;
    l /= 100;
    const f = ( n ) => {
      const k = ( n + h / 30 ) % 12;
      const c = l - s * Math.min( l, 1 - l ) * Math.max( -1, Math.min( k - 3, 9 - k, 1 ) );
      return Math.round( c * 255 ).toString( 16 ).padStart( 2, "0" );
    };
    return `#${f( 0 )}${f( 8 )}${f( 4 )}`;
  }

  // 가닥마다 새 색을 무작위로 뽑음. 색상(hue)은 황금각(≈137.5°)씩 벌려서 비슷한 색이 겹치지 않게 함
  function randomColors() {
    const h0 = Math.random() * 360;
    colors = colors.map( ( _, i ) =>
      hslToHex( ( h0 + i * 137.508 ) % 360, 55 + Math.random() * 40, 35 + Math.random() * 35 ),
    );
    drawRing();
    drawBraid();
  }

  // 색을 하나 골라 모든 가닥에 똑같이 칠함
  function uniformColor() {
    proxy.value = colors[ 0 ];
    proxy.onchange = function() {
      colors = colors.map( () => this.value );
      drawRing();
      drawBraid();
    };
    proxy.click();
  }

  // ── Braid 마우스/터치 입력 ──────────────────────────────────────
  bc.addEventListener( "mousedown", ( e ) => {
    dragging = true;
    lx = e.clientX;
    ly = e.clientY;
  } );
  window.addEventListener( "mousemove", ( e ) => {
    if ( !dragging ) return;
    rotY += ( e.clientX - lx ) * 0.011;
    rotX += ( e.clientY - ly ) * 0.011;
    rotX = Math.max( -1.3, Math.min( 1.3, rotX ) );
    lx = e.clientX;
    ly = e.clientY;
    requestDraw();
  } );
  window.addEventListener( "mouseup", () => ( dragging = false ) );
  bc.addEventListener(
    "wheel",
    ( e ) => {
      e.preventDefault();
      zoom *= e.deltaY > 0 ? 0.91 : 1.09;
      zoom = Math.max( 0.3, Math.min( 3.5, zoom ) );
      requestDraw();
    },
    { passive: false },
  );
  let pinchDist0 = null;
  bc.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchDist0 = Math.hypot(dx, dy);
        dragging = false;
      } else {
        pinchDist0 = null;
        dragging = true;
        lx = e.touches[0].clientX;
        ly = e.touches[0].clientY;
      }
    },
    { passive: false },
  );
  bc.addEventListener(
    "touchmove",
    (e) => {
      e.preventDefault();
      if (e.touches.length === 2 && pinchDist0 !== null) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        zoom *= dist / pinchDist0;
        zoom = Math.max(0.3, Math.min(3.5, zoom));
        pinchDist0 = dist;
        requestDraw();
      } else if (e.touches.length === 1 && dragging) {
        rotY += (e.touches[0].clientX - lx) * 0.013;
        rotX += (e.touches[0].clientY - ly) * 0.013;
        rotX = Math.max(-1.3, Math.min(1.3, rotX));
        lx = e.touches[0].clientX;
        ly = e.touches[0].clientY;
        requestDraw();
      }
    },
    { passive: false },
  );
  bc.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) pinchDist0 = null;
    if (e.touches.length === 0) dragging = false;
  });

  // ── 슬라이더 입력 ───────────────────────────────────────────────
  document.getElementById( "heightSlider" ).addEventListener( "input", function() {
    steps = parseInt( this.value );
    document.getElementById( "heightVal" ).textContent = steps;
    states = computeStates( steps );
    updateStepNav();
    drawRing();
    drawBraid();
  } );
  document.getElementById( "stepHSlider" ).addEventListener( "input", function() {
    stepH = parseFloat( this.value );
    document.getElementById( "stepHVal" ).textContent = stepH.toFixed( 2 );
    drawBraid();
  } );
  document.getElementById( "thicknessSlider" ).addEventListener( "input", function() {
    thickness = parseInt( this.value );
    document.getElementById( "thicknessVal" ).textContent = thickness;
    drawBraid();
  } );

  // ── 초기 렌더 ───────────────────────────────────────────────────
  if (window.matchMedia("(pointer: coarse)").matches) {
    document.querySelector(".hint").textContent =
      "한 손가락 드래그 회전  ·  두 손가락 핀치 확대축소";
  }
  updateStepNav();
  drawRing();
  drawBraid();
</script>
