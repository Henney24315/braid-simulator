<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>12사광다회치기 시뮬레이터</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Orbit&family=ZCOOL+QingKe+HuangYou&display=swap');

  /* ── 테마 변수 ─────────────────────────────────────────────────
     여기서만 수정하면 전체 UI 색상이 바뀝니다.
     --primary     : 메인 강조색 (solid)
     --primary-rgb : 강조색 R,G,B (rgba() 투명도 조합용)
     --bg          : 캔버스·앱 배경색
     --core-rgb    : 가운데 막대기 재질색 (조명 계산에 사용)
  ─────────────────────────────────────────────────────────────── */
  :root {
    --primary: #6495ed;
    --primary-rgb: 100, 149, 237;
    --bg: #ffffff;
    --core-rgb: 230, 205, 165;
    /* 가운데 막대기 나무색 */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    font-family: "Orbit", monospace;
    width: 100%;
    background: var(--bg);
  }

  .app {
    display: flex;
    flex-direction: column;
  }

  .topbar {
    padding: 11px 18px 9px;
    border-bottom: 1px solid rgba(var(--primary-rgb), 0.15);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .ttl {
    font-size: 15px;
    color: var(--primary);
    letter-spacing: 0.05em;
  }

  .nav {
    margin-left: auto;
    font-size: 11px;
    color: var(--primary);
    text-decoration: none;
    border: 1px solid rgba(var(--primary-rgb), 0.25);
    border-radius: 4px;
    padding: 3px 8px;
    letter-spacing: 0.04em;
  }

  .nav:hover {
    border-color: rgba(var(--primary-rgb), 0.6);
  }

  .body {
    display: flex;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    gap: 8px;
  }

  canvas#braid {
    border-radius: 6px;
    cursor: grab;
    max-width: 100%;
    height: auto;
    aspect-ratio: 420 / 620;
    display: block;
  }

  canvas#braid:active {
    cursor: grabbing;
  }

  .hint {
    font-size: 9px;
    color: var(--primary);
    letter-spacing: 0.1em;
  }

  .right {
    width: 256px;
    border-left: 1px solid rgba(var(--primary-rgb), 0.1);
    display: flex;
    flex-direction: column;
  }

  .picker-area {
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .lbl {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--primary);
    text-transform: uppercase;
    align-self: flex-start;
  }

  canvas#layout {
    width: 228px;
    max-width: 100%;
    height: auto;
    aspect-ratio: 228 / 186;
    display: block;
    cursor: default;
  }

  .stepnav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 11px;
    color: var(--primary);
  }

  .stepnav button {
    width: 26px;
    height: 22px;
    background: transparent;
    border: 1px solid rgba(var(--primary-rgb), 0.25);
    border-radius: 4px;
    color: var(--primary);
    font-size: 10px;
    cursor: pointer;
  }

  .stepnav button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .stepnav span {
    min-width: 72px;
    text-align: center;
  }

  #colorProxy {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    top: 0;
    left: 50%;
    width: 0;
    height: 0;
  }

  .sliders {
    padding: 10px 14px;
    border-top: 1px solid rgba(var(--primary-rgb), 0.1);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .sr {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .srow {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--primary);
  }

  .sv {
    color: var(--primary);
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: rgba(var(--primary-rgb), 0.2);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
  }

  .rbtn {
    margin: 8px 14px 12px;
    padding: 8px;
    background: transparent;
    border: 1px solid rgba(var(--primary-rgb), 0.18);
    border-radius: 4px;
    color: var(--primary);
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.04em;
    width: calc(100% - 28px);
  }

  .rbtn:hover {
    border-color: rgba(var(--primary-rgb), 0.5);
    color: var(--primary);
  }

  .copyright {
    border-top: 1px solid rgba(var(--primary-rgb), 0.15);
    text-align: center;
    padding: 10px 0 12px;
    font-size: 10px;
    color: var(--primary);
    letter-spacing: 0.1em;
    white-space: pre-wrap;
  }

  /* ── 모바일 반응형 ─────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .body {
      flex-direction: column;
    }
    .left {
      padding: 10px 12px 4px;
      width: 100%;
    }
    canvas#braid {
      max-height: 70vh;
      width: auto;
    }
    .right {
      width: 100%;
      border-left: none;
      border-top: 1px solid rgba(var(--primary-rgb), 0.1);
    }
    .picker-area {
      padding: 10px 12px 8px;
    }
    .sliders {
      padding: 10px 12px;
    }
    .rbtn {
      margin: 8px 12px 12px;
      width: calc(100% - 24px);
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 20px;
      height: 20px;
    }
    input[type="range"] {
      height: 4px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span class="ttl">12사광다회치기 시뮬레이터</span>
    <a class="nav" href="index.html">← 8사치기</a>
  </div>
  <div class="body">
    <div class="left">
      <canvas id="braid" width="420" height="620"></canvas>
      <div class="hint">드래그 회전 &nbsp;·&nbsp; 휠 확대축소</div>
    </div>
    <div class="right">
      <div class="picker-area">
        <div class="lbl">가닥 배치 (클릭 → 색상 변경)</div>
        <canvas id="layout" width="228" height="186"></canvas>
        <div class="stepnav">
          <button id="stepPrev" aria-label="이전 단">◀</button>
          <span id="stepLabel">시작 배치</span>
          <button id="stepNext" aria-label="다음 단">▶</button>
        </div>
      </div>
      <div class="controls">
        <div class="sliders">
          <div class="sr">
            <div class="srow">
              <span>높이 (단 수)</span>
              <span class="sv" id="heightVal">12</span>
            </div>
            <input type="range" id="heightSlider" min="1" max="40" step="1" value="12" />
          </div>
          <div class="sr">
            <div class="srow">
              <span>단 간격</span>
              <span class="sv" id="stepHVal">0.24</span>
            </div>
            <input type="range" id="stepHSlider" min="0.1" max="0.5" step="0.01" value="0.24" />
          </div>
          <div class="sr">
            <div class="srow">
              <span>가닥 두께</span>
              <span class="sv" id="thicknessVal">8</span>
            </div>
            <input type="range" id="thicknessSlider" min="1" max="20" step="1" value="8" />
          </div>
        </div>
        <button class="rbtn" onclick="resetView()">↺ 시점 초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ── CSS 테마 변수 → JS 상수 ──────────────────────────────────────
  const _cs = getComputedStyle( document.documentElement );
  const _primRgb = _cs.getPropertyValue( "--primary-rgb" ).trim();
  const _coreRgb = _cs.getPropertyValue( "--core-rgb" ).trim();
  const _bg = _cs.getPropertyValue( "--bg" ).trim();

  /** rgba(--primary-rgb, alpha) */
  const acRgba = ( a ) => `rgba(${_primRgb},${a})`;
  /** --core-rgb 배열 [r,g,b] (막대기 조명용) */
  const coreArr = _coreRgb.split( "," ).map( Number );

  // ── 배색 설정 (여기서만 수정) ────────────────────────────────────
  // R1~R6, L1~L6 (총 12가닥)
  const COLORS = {
    R1: "#F7FF1C",
    R2: "#1C7BFF",
    R3: "#FFAA52",
    R4: "#FF52F6",
    R5: "#8E44FF",
    R6: "#00C2C7",
    L1: "#1CFF55",
    L2: "#ffffff",
    L3: "#FF1C7A",
    L4: "#888888",
    L5: "#A0522D",
    L6: "#2B2B2B",
  };
  const STRANDS = Object.keys( COLORS );

  // ── 자리(슬롯) ──────────────────────────────────────────────────
  // 위에서 내려다본 단면. 가운데에 막대기, 나는 아래쪽.
  //
  //        T1 T2 T3 T4
  //   LU        |        RU
  //   LD        |        RD
  //        B1 B2 B3 B4
  //
  // 배열 순서 = 둘레를 시계 방향으로 한 바퀴 (왼쪽 위 모서리에서 시작).
  // 둘레 좌표 s 에서 자리 i 의 중심은 s = i + 0.5 (자리 간격 = 1).
  const POS = [ "T1", "T2", "T3", "T4", "RU", "RD", "B4", "B3", "B2", "B1", "LD", "LU" ];
  const POS_IDX = Object.fromEntries( POS.map( ( p, i ) => [ p, i ] ) );
  const N_POS = POS.length;

  // 시작 배치
  //        R1 R2 L1 L2
  //   L6        |        R3
  //   R6        |        L3
  //        L5 L4 R5 R4
  const START = {
    T1: "R1", T2: "R2", T3: "L1", T4: "L2",
    LU: "L6", RU: "R3",
    LD: "R6", RD: "L3",
    B1: "L5", B2: "L4", B3: "R5", B4: "R4",
  };

  // 한 단(段)마다 실이 옮겨 가는 규칙 { 지금 자리: 다음 자리 }
  // 적히지 않은 자리의 실은 그대로 내려옴. 단마다 차례로 돌아가며 적용 (L 단 → R 단 → L 단 …).
  //
  // 1단: L 가닥이 반시계 방향으로 이동
  //        R1 R2 L1 L2               R1 R2 L1 L3
  //   L6        |        R3   →   L2        |        R3
  //   R6        |        L3       R6        |        L4
  //        L5 L4 R5 R4               L6 L5 R5 R4
  //
  // 2단: R 가닥이 반대(시계) 방향으로 이동 — 1단을 좌우로 뒤집은 모양
  //        R1 R2 L1 L3               R6 R2 L1 L3
  //   L2        |        R3   →   L2        |        R1
  //   R6        |        L4       R5        |        L4
  //        L6 L5 R5 R4               L6 L5 R4 R3
  const STEP_RULES = [
    { T4: "LU", RD: "T4", B2: "RD", B1: "B2", LU: "B1" },
    { T1: "RU", LD: "T1", B3: "LD", B4: "B3", RU: "B4" },
  ];

  /** 단 0..n 의 배치. states[j][자리] = 가닥 번호 */
  function computeStates( n ) {
    let cur = POS.map( ( p ) => STRANDS.indexOf( START[ p ] ) );
    const states = [ cur ];
    for ( let j = 0; j < n; j++ ) {
      const rule = STEP_RULES[ j % STEP_RULES.length ];
      const next = cur.slice();
      for ( const [ from, to ] of Object.entries( rule ) ) {
        next[ POS_IDX[ to ] ] = cur[ POS_IDX[ from ] ];
      }
      states.push( next );
      cur = next;
    }
    return states;
  }

  /** 자리 a → b 로 둘레를 따라 가는 가장 짧은 방향의 이동량 (음수 = 반시계) */
  function shortestDelta( a, b ) {
    return ( ( ( b - a + N_POS * 1.5 ) % N_POS ) + N_POS ) % N_POS - N_POS / 2;
  }

  const mod = ( v, m ) => ( ( v % m ) + m ) % m;
  const smooth = ( t ) => t * t * ( 3 - 2 * t );

  // ── 전역 상태 ───────────────────────────────────────────────────
  let colors = STRANDS.map( ( k ) => COLORS[ k ] );
  let steps = 12;
  let stepH = 0.24;
  let thickness = 8;
  let viewStep = 0;
  let states = computeStates( steps );
  let rotX = 0;
  let rotY = 0;
  let zoom = 1;
  let dragging = false;
  let lx = 0,
    ly = 0;
  let hovered = -1;

  function isDark( hex ) {
    const r = parseInt( hex.slice( 1, 3 ), 16 );
    const g = parseInt( hex.slice( 3, 5 ), 16 );
    const b = parseInt( hex.slice( 5, 7 ), 16 );
    return ( r * 299 + g * 587 + b * 114 ) / 1000 < 128;
  }

  function hexToRgb( hex ) {
    return [
      parseInt( hex.slice( 1, 3 ), 16 ),
      parseInt( hex.slice( 3, 5 ), 16 ),
      parseInt( hex.slice( 5, 7 ), 16 ),
    ];
  }

  // ── 배치도 캔버스 ───────────────────────────────────────────────
  const lc = document.getElementById( "layout" );
  const lctx = lc.getContext( "2d" );
  const LW = lc.width,
    LH = lc.height,
    LCX = LW / 2,
    LCY = 82;
  const SP = 34, // 배치도의 자리 간격(px)
    DOT_R = 14,
    HX = 2.5 * SP,
    HY = 1.5 * SP,
    TRACK = 20; // 이동 화살표가 지나가는 바깥 트랙 거리

  // 배치도 둘레: [s, x, y, 바깥방향 ex, ey] (모서리는 자리 하나 간격만큼 떨어져 있음)
  const DIAG_WP = [
    [ 0, -HX, -HY, -1, -1 ],
    [ 0.5, -1.5 * SP, -HY, 0, -1 ],
    [ 1.5, -0.5 * SP, -HY, 0, -1 ],
    [ 2.5, 0.5 * SP, -HY, 0, -1 ],
    [ 3.5, 1.5 * SP, -HY, 0, -1 ],
    [ 4, HX, -HY, 1, -1 ],
    [ 4.5, HX, -0.5 * SP, 1, 0 ],
    [ 5.5, HX, 0.5 * SP, 1, 0 ],
    [ 6, HX, HY, 1, 1 ],
    [ 6.5, 1.5 * SP, HY, 0, 1 ],
    [ 7.5, 0.5 * SP, HY, 0, 1 ],
    [ 8.5, -0.5 * SP, HY, 0, 1 ],
    [ 9.5, -1.5 * SP, HY, 0, 1 ],
    [ 10, -HX, HY, -1, 1 ],
    [ 10.5, -HX, 0.5 * SP, -1, 0 ],
    [ 11.5, -HX, -0.5 * SP, -1, 0 ],
    [ 12, -HX, -HY, -1, -1 ],
  ];

  function diagPoint( s, off ) {
    s = mod( s, N_POS );
    for ( let i = 0; i < DIAG_WP.length - 1; i++ ) {
      const a = DIAG_WP[ i ],
        b = DIAG_WP[ i + 1 ];
      if ( s <= b[ 0 ] ) {
        const t = ( s - a[ 0 ] ) / ( b[ 0 ] - a[ 0 ] );
        const lerp = ( k ) => a[ k ] + ( b[ k ] - a[ k ] ) * t;
        return { x: LCX + lerp( 1 ) + lerp( 3 ) * off, y: LCY + lerp( 2 ) + lerp( 4 ) * off };
      }
    }
  }

  const slotXY = ( i ) => diagPoint( i + 0.5, 0 );

  function drawLayout() {
    lctx.clearRect( 0, 0, LW, LH );
    const st = states[ viewStep ];

    // 가이드 사각형
    lctx.beginPath();
    lctx.rect( LCX - HX, LCY - HY, HX * 2, HY * 2 );
    lctx.strokeStyle = acRgba( 1 );
    lctx.lineWidth = 1;
    lctx.setLineDash( [ 2, 5 ] );
    lctx.stroke();
    lctx.setLineDash( [] );

    // 가운데 막대기
    lctx.beginPath();
    lctx.roundRect( LCX - 4, LCY - 30, 8, 60, 3 );
    lctx.fillStyle = `rgb(${coreArr.join( "," )})`;
    lctx.fill();
    lctx.strokeStyle = "rgba(0,0,0,0.25)";
    lctx.stroke();

    // 다음 단으로 옮겨 가는 실의 경로 (바깥 트랙)
    if ( viewStep < steps ) {
      const nx = states[ viewStep + 1 ];
      for ( let p = 0; p < N_POS; p++ ) {
        const si = st[ p ];
        const q = nx.indexOf( si );
        if ( q === p ) continue;
        const d = shortestDelta( p, q );
        const s0 = p + 0.5;
        const N = Math.ceil( Math.abs( d ) * 12 );
        const pts = [];
        for ( let k = 0; k <= N; k++ ) pts.push( diagPoint( s0 + ( d * k ) / N, TRACK ) );
        // 바깥쪽으로 나갔다가 돌아오도록 시작·끝은 자리 쪽으로 연결
        pts.unshift( slotXY( p ) );
        pts.push( slotXY( q ) );

        lctx.lineJoin = "round";
        lctx.lineCap = "round";
        lctx.beginPath();
        pts.forEach( ( pt, k ) => ( k ? lctx.lineTo( pt.x, pt.y ) : lctx.moveTo( pt.x, pt.y ) ) );
        lctx.strokeStyle = "rgba(0,0,0,0.35)";
        lctx.lineWidth = 4.5;
        lctx.stroke();
        lctx.strokeStyle = colors[ si ];
        lctx.lineWidth = 2.5;
        lctx.stroke();

        // 화살촉 (트랙 끝 지점에서 자리 쪽으로)
        const tip = pts[ pts.length - 2 ],
          prev = pts[ pts.length - 3 ];
        const ang = Math.atan2( tip.y - prev.y, tip.x - prev.x );
        lctx.beginPath();
        lctx.moveTo( tip.x + 7 * Math.cos( ang ), tip.y + 7 * Math.sin( ang ) );
        lctx.lineTo( tip.x + 7 * Math.cos( ang + 2.5 ), tip.y + 7 * Math.sin( ang + 2.5 ) );
        lctx.lineTo( tip.x + 7 * Math.cos( ang - 2.5 ), tip.y + 7 * Math.sin( ang - 2.5 ) );
        lctx.closePath();
        lctx.fillStyle = "rgba(0,0,0,0.55)";
        lctx.fill();
      }
    }

    // 자리 도트
    for ( let p = 0; p < N_POS; p++ ) {
      const si = st[ p ];
      const pt = slotXY( p );
      const col = colors[ si ];
      const hov = p === hovered;

      if ( hov ) {
        lctx.beginPath();
        lctx.arc( pt.x, pt.y, DOT_R + 6, 0, Math.PI * 2 );
        lctx.fillStyle = col + "25";
        lctx.fill();
      }

      lctx.beginPath();
      lctx.arc( pt.x, pt.y, DOT_R + 1, 0, Math.PI * 2 );
      lctx.fillStyle = "rgba(0,0,0,0.5)";
      lctx.fill();

      lctx.beginPath();
      lctx.arc( pt.x, pt.y, DOT_R, 0, Math.PI * 2 );
      lctx.fillStyle = col;
      lctx.fill();
      lctx.strokeStyle = hov ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.18)";
      lctx.lineWidth = hov ? 2 : 1;
      lctx.stroke();

      lctx.fillStyle = isDark( col ) ? "rgba(255,255,255,1)" : "rgba(0,0,0,0.75)";
      lctx.font = "10px sans-serif";
      lctx.textAlign = "center";
      lctx.textBaseline = "middle";
      lctx.fillText( STRANDS[ si ], pt.x, pt.y );
    }

    // "나" 기준점
    const mx = LCX,
      my = LCY + HY + TRACK + 10;
    lctx.beginPath();
    lctx.moveTo( mx, my - 7 );
    lctx.lineTo( mx - 5, my );
    lctx.lineTo( mx + 5, my );
    lctx.closePath();
    lctx.fillStyle = acRgba( 0.55 );
    lctx.fill();
    lctx.fillStyle = acRgba( 0.65 );
    lctx.textAlign = "center";
    lctx.textBaseline = "top";
    lctx.fillText( "나", mx, my + 1 );
  }

  function hitDot( ex, ey ) {
    const rect = lc.getBoundingClientRect();
    const mx = ( ex - rect.left ) * ( LW / rect.width );
    const my = ( ey - rect.top ) * ( LH / rect.height );
    for ( let p = 0; p < N_POS; p++ ) {
      const pt = slotXY( p );
      if ( ( mx - pt.x ) ** 2 + ( my - pt.y ) ** 2 <= ( DOT_R + 4 ) ** 2 ) return p;
    }
    return -1;
  }

  lc.addEventListener( "mousemove", ( e ) => {
    const h = hitDot( e.clientX, e.clientY );
    if ( h !== hovered ) {
      hovered = h;
      drawLayout();
    }
    lc.style.cursor = h >= 0 ? "pointer" : "default";
  } );
  lc.addEventListener( "mouseleave", () => {
    hovered = -1;
    drawLayout();
    lc.style.cursor = "default";
  } );

  const proxy = document.getElementById( "colorProxy" );
  lc.addEventListener( "click", ( e ) => {
    const h = hitDot( e.clientX, e.clientY );
    if ( h < 0 ) return;
    const si = states[ viewStep ][ h ];
    proxy.value = colors[ si ];
    proxy.onchange = function() {
      colors[ si ] = this.value;
      drawLayout();
      drawBraid();
    };
    proxy.click();
  } );

  // ── 단 보기 (◀ ▶) ───────────────────────────────────────────────
  const stepPrev = document.getElementById( "stepPrev" );
  const stepNext = document.getElementById( "stepNext" );
  const stepLabel = document.getElementById( "stepLabel" );

  function updateStepNav() {
    viewStep = Math.max( 0, Math.min( steps, viewStep ) );
    stepLabel.textContent = viewStep === 0 ? "시작 배치" : `${viewStep}단 후`;
    stepPrev.disabled = viewStep === 0;
    stepNext.disabled = viewStep === steps;
  }
  stepPrev.addEventListener( "click", () => {
    viewStep--;
    updateStepNav();
    drawLayout();
  } );
  stepNext.addEventListener( "click", () => {
    viewStep++;
    updateStepNav();
    drawLayout();
  } );

  // ── Braid 3D 캔버스 ─────────────────────────────────────────────
  const bc = document.getElementById( "braid" );
  const bctx = bc.getContext( "2d" );
  const BW = bc.width,
    BH = bc.height,
    BCX = BW / 2,
    BCY = BH / 2;

  // 단면 크기: 자리 간격 = 세로(두께) 반폭, 가로 반폭 = 2배 → 위·아래 4자리, 양옆 2자리
  const GAP = 0.15;
  const HALF_W = 2 * GAP,
    HALF_D = GAP;
  const OFF0 = 0.05, // 실이 막대기 표면에서 떠 있는 거리
    OFF_AMP = 0.035; // 위/아래로 지나갈 때 더해지는 거리
  const PERSP = 720 / ( 720 + 230 );
  let sc = 112;

  // 원근 투영: rotY(Y축) → rotX(X축) 회전 후 Z축 원근 적용, d(깊이)=큰값이 카메라에서 멀어짐
  function proj( x, y, z ) {
    const x1 = x * Math.cos( rotY ) - z * Math.sin( rotY );
    const z1 = x * Math.sin( rotY ) + z * Math.cos( rotY );
    const y2 = y * Math.cos( rotX ) - z1 * Math.sin( rotX );
    const z2 = y * Math.sin( rotX ) + z1 * Math.cos( rotX );
    const s = 720 / ( 720 + z2 + 230 );
    return { sx: BCX + x1 * s * sc, sy: BCY + y2 * s * sc, d: z2 };
  }

  /** 수평 법선 (cos φ, 0, sin φ) 의 카메라 방향 성분. 음수면 나를 향함 */
  function facing( phi ) {
    return ( Math.cos( phi ) * Math.sin( rotY ) + Math.sin( phi ) * Math.cos( rotY ) ) * Math.cos( rotX );
  }

  // 둘레 좌표 s → 막대기 표면의 점 (x, z). 0~4 위(뒤쪽), 4~6 오른쪽, 6~10 아래(앞쪽), 10~12 왼쪽
  function rectPoint( s ) {
    s = mod( s, N_POS );
    if ( s < 4 ) return { x: -HALF_W + s * GAP, z: HALF_D };
    if ( s < 6 ) return { x: HALF_W, z: HALF_D - ( s - 4 ) * GAP };
    if ( s < 10 ) return { x: HALF_W - ( s - 6 ) * GAP, z: -HALF_D };
    return { x: -HALF_W, z: -HALF_D + ( s - 10 ) * GAP };
  }

  const CORNER_S = [ 0, 4, 6, 10, 12 ];
  const EDGE_PHI = [ 90, 0, -90, -180 ]; // 위, 오른쪽, 아래, 왼쪽 면의 바깥 법선 각도(°)

  // 바깥 법선 각도. 모서리 근처에서는 부드럽게 돌아가게 해서 실이 모서리를 둥글게 감음
  function normalAngle( s ) {
    s = mod( s, N_POS );
    const H = 0.3;
    const e = s < 4 ? 0 : s < 6 ? 1 : s < 10 ? 2 : 3;
    const c0 = CORNER_S[ e ],
      c1 = CORNER_S[ e + 1 ];
    let phi = EDGE_PHI[ e ];
    if ( s - c0 < H ) phi = phi + 90 - 90 * smooth( ( s - c0 + H ) / ( 2 * H ) );
    else if ( c1 - s < H ) phi = phi - 90 * smooth( ( s - c1 + H ) / ( 2 * H ) );
    return ( phi * Math.PI ) / 180;
  }

  // 가운데 막대기 (직사각형 기둥, 뒷면 실을 가리는 역할)
  function drawCore( L ) {
    const yT = -L / 2,
      yB = L / 2;
    const cw = HALF_W * 0.99,
      cd = HALF_D * 0.99;
    const ring = [ [ -cw, cd ], [ cw, cd ], [ cw, -cd ], [ -cw, -cd ] ];
    const shade = ( diffuse ) => {
      const v = 0.45 + diffuse * 0.65;
      return `rgb(${Math.round( coreArr[ 0 ] * v )},${Math.round( coreArr[ 1 ] * v )},${Math.round( coreArr[ 2 ] * v )})`;
    };
    const poly = ( pts, fill ) => {
      bctx.beginPath();
      pts.forEach( ( p, i ) => ( i ? bctx.lineTo( p.sx, p.sy ) : bctx.moveTo( p.sx, p.sy ) ) );
      bctx.closePath();
      bctx.fillStyle = fill;
      bctx.fill();
      bctx.strokeStyle = "rgba(0,0,0,0.12)";
      bctx.lineWidth = 1;
      bctx.stroke();
    };

    // 옆면 4개
    for ( let e = 0; e < 4; e++ ) {
      const nz = facing( ( EDGE_PHI[ e ] * Math.PI ) / 180 );
      if ( nz >= 0 ) continue;
      const [ x0, z0 ] = ring[ e ],
        [ x1, z1 ] = ring[ ( e + 1 ) % 4 ];
      poly( [ proj( x0, yT, z0 ), proj( x1, yT, z1 ), proj( x1, yB, z1 ), proj( x0, yB, z0 ) ], shade( -nz ) );
    }
    // 윗면 / 아랫면
    const capN = Math.sin( rotX );
    if ( capN !== 0 ) {
      const y = capN > 0 ? yT : yB;
      poly( ring.map( ( [ x, z ] ) => proj( x, y, z ) ), shade( Math.abs( capN ) * 0.8 ) );
    }
  }

  function drawBraid() {
    bctx.clearRect( 0, 0, BW, BH );
    bctx.fillStyle = _bg || "#ffffff";
    bctx.fillRect( 0, 0, BW, BH );

    const L = steps * stepH;
    sc = zoom * Math.min( 260, ( BH * 0.84 ) / ( L * PERSP ) );
    const SUB = 16;
    const backSegs = [],
      frontSegs = [];

    // 가닥 si 가 단 j 에서 j+1 로 넘어가는 동안의 위치 (u: 0~1)
    function pathPoint( p0, delta, j, u ) {
      const e = smooth( u );
      const s = p0 + 0.5 + delta * e;
      // 옮겨 가는 실: 지나가는 자리마다 위 → 아래 → 위 … 번갈아 지나감
      const ov = delta ? -Math.sin( Math.PI * e ) * Math.cos( Math.PI * Math.abs( delta ) * e ) : 0;
      const phi = normalAngle( s );
      const r = rectPoint( s );
      const off = OFF0 + OFF_AMP * ov;
      return {
        p: proj( r.x + off * Math.cos( phi ), -L / 2 + ( j + u ) * stepH, r.z + off * Math.sin( phi ) ),
        ov,
        phi,
      };
    }

    for ( let si = 0; si < STRANDS.length; si++ ) {
      const rgb = hexToRgb( colors[ si ] );
      for ( let j = 0; j < steps; j++ ) {
        const p0 = states[ j ].indexOf( si );
        const p1 = states[ j + 1 ].indexOf( si );
        const delta = shortestDelta( p0, p1 );
        let prev = pathPoint( p0, delta, j, 0 );
        for ( let k = 1; k <= SUB; k++ ) {
          const cur = pathPoint( p0, delta, j, k / SUB );
          const mid = pathPoint( p0, delta, j, ( k - 0.5 ) / SUB );
          const nz = facing( mid.phi );
          const light = 0.6 + 0.55 * Math.max( 0, -nz );
          const sh = light * ( 1 + 0.3 * mid.ov );
          const seg = {
            p0: prev.p,
            p1: cur.p,
            col: `rgb(${Math.min( 255, Math.round( rgb[ 0 ] * sh ) )},${Math.min( 255, Math.round( rgb[ 1 ] * sh ) )},${Math.min( 255, Math.round( rgb[ 2 ] * sh ) )})`,
            lw: ( thickness / 10 ) * GAP * sc * PERSP * ( 1 + 0.12 * mid.ov ),
            d: mid.p.d,
          };
          // 나를 향한 면의 실은 막대기 앞에, 반대쪽 면의 실은 막대기 뒤에 그림
          ( nz < 0 ? frontSegs : backSegs ).push( seg );
          prev = cur;
        }
      }
    }

    // painter's algorithm: 먼 것(큰 d)부터 그려야 가까운 것이 위에 표시됨
    backSegs.sort( ( a, b ) => b.d - a.d );
    frontSegs.sort( ( a, b ) => b.d - a.d );

    function drawSeg( { p0, p1, col, lw } ) {
      bctx.beginPath();
      bctx.moveTo( p0.sx, p0.sy );
      bctx.lineTo( p1.sx, p1.sy );
      bctx.strokeStyle = col;
      bctx.lineWidth = lw;
      bctx.lineCap = "round";
      bctx.stroke();
    }

    backSegs.forEach( drawSeg );
    drawCore( L );
    frontSegs.forEach( drawSeg );
  }

  function resetView() {
    rotX = 0;
    rotY = 0;
    zoom = 1;
    drawBraid();
  }

  // ── Braid 마우스/터치 입력 ──────────────────────────────────────
  bc.addEventListener( "mousedown", ( e ) => {
    dragging = true;
    lx = e.clientX;
    ly = e.clientY;
  } );
  window.addEventListener( "mousemove", ( e ) => {
    if ( !dragging ) return;
    rotY += ( e.clientX - lx ) * 0.011;
    rotX += ( e.clientY - ly ) * 0.011;
    rotX = Math.max( -1.3, Math.min( 1.3, rotX ) );
    lx = e.clientX;
    ly = e.clientY;
    drawBraid();
  } );
  window.addEventListener( "mouseup", () => ( dragging = false ) );
  bc.addEventListener(
    "wheel",
    ( e ) => {
      e.preventDefault();
      zoom *= e.deltaY > 0 ? 0.91 : 1.09;
      zoom = Math.max( 0.3, Math.min( 3.5, zoom ) );
      drawBraid();
    },
    { passive: false },
  );
  let pinchDist0 = null;
  bc.addEventListener(
    "touchstart",
    ( e ) => {
      e.preventDefault();
      if ( e.touches.length === 2 ) {
        const dx = e.touches[ 0 ].clientX - e.touches[ 1 ].clientX;
        const dy = e.touches[ 0 ].clientY - e.touches[ 1 ].clientY;
        pinchDist0 = Math.hypot( dx, dy );
        dragging = false;
      } else {
        pinchDist0 = null;
        dragging = true;
        lx = e.touches[ 0 ].clientX;
        ly = e.touches[ 0 ].clientY;
      }
    },
    { passive: false },
  );
  bc.addEventListener(
    "touchmove",
    ( e ) => {
      e.preventDefault();
      if ( e.touches.length === 2 && pinchDist0 !== null ) {
        const dx = e.touches[ 0 ].clientX - e.touches[ 1 ].clientX;
        const dy = e.touches[ 0 ].clientY - e.touches[ 1 ].clientY;
        const dist = Math.hypot( dx, dy );
        zoom *= dist / pinchDist0;
        zoom = Math.max( 0.3, Math.min( 3.5, zoom ) );
        pinchDist0 = dist;
        drawBraid();
      } else if ( e.touches.length === 1 && dragging ) {
        rotY += ( e.touches[ 0 ].clientX - lx ) * 0.013;
        rotX += ( e.touches[ 0 ].clientY - ly ) * 0.013;
        rotX = Math.max( -1.3, Math.min( 1.3, rotX ) );
        lx = e.touches[ 0 ].clientX;
        ly = e.touches[ 0 ].clientY;
        drawBraid();
      }
    },
    { passive: false },
  );
  bc.addEventListener( "touchend", ( e ) => {
    if ( e.touches.length < 2 ) pinchDist0 = null;
    if ( e.touches.length === 0 ) dragging = false;
  } );

  // ── 슬라이더 입력 ───────────────────────────────────────────────
  document.getElementById( "heightSlider" ).addEventListener( "input", function() {
    steps = parseInt( this.value );
    document.getElementById( "heightVal" ).textContent = steps;
    states = computeStates( steps );
    updateStepNav();
    drawLayout();
    drawBraid();
  } );
  document.getElementById( "stepHSlider" ).addEventListener( "input", function() {
    stepH = parseFloat( this.value );
    document.getElementById( "stepHVal" ).textContent = stepH.toFixed( 2 );
    drawBraid();
  } );
  document.getElementById( "thicknessSlider" ).addEventListener( "input", function() {
    thickness = parseInt( this.value );
    document.getElementById( "thicknessVal" ).textContent = thickness;
    drawBraid();
  } );

  // ── 초기 렌더 ───────────────────────────────────────────────────
  if ( window.matchMedia( "(pointer: coarse)" ).matches ) {
    document.querySelector( ".hint" ).textContent =
      "한 손가락 드래그 회전  ·  두 손가락 핀치 확대축소";
  }
  updateStepNav();
  drawLayout();
  drawBraid();
</script>
</body>
</html>
